{% if jobs and jobs|length > 0 %}
  {% for job in jobs %}
    <li class="cm-job-card">
      <div class="cm-job-main">
        <h4>{{ job.title }}</h4>
        <p class="cm-job-meta">
          {{ job.company }} · {{ job.location }} · {{ job.mode }}
        </p>
        <p class="cm-job-snippet">
          {{ job.snippet }}
        </p>
      </div>

      <button 
        class="btn ghost cm-job-analyze-btn"
        hx-post="/cm/analyze"
        hx-target="#cm-match-panel"
        hx-swap="innerHTML"
        hx-vals='{"job_id": "{{ job.id }}"}'>
          Analyze match
      </button>
    </li>
  {% endfor %}
{% else %}
  <li class="cm-no-results">
    <p>No job results found.</p>
    <p class="cm-no-results-sub">Try different keywords or locations.</p>
  </li>
{% endif %}
