<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
  </head>
  <body>
    <section class="auth-page">
      <div class="auth-card">

        <!-- Logo -->
        <h3 class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="15" width="3" height="6" rx="1" fill="#2e6a84"/>
            <rect x="9" y="10" width="3" height="11" rx="1" fill="#2e6a84"/>
            <rect x="15" y="5" width="3" height="16" rx="1" fill="#2e6a84"/>
          </svg>
          <span class="logo-text">Ta<span>lentum</span></span>
        </h3>
        
        <!-- Title and Subtitle -->
        <h2 id="form-title">Login</h2>
        <p class="login-subtitle">
          Let’s continue this journey together
        </p>

        <!-- Login Form -->
        <form id="login-form" method="post" action="/auth/login" enctype="application/x-www-form-urlencoded" class="auth-form active">
          <input type="email" name="email" placeholder="Email" required>

          <!-- Password Field with Toggle -->
          <!-- LOGIN -->
          <div class="password-field">
            <input id="login-password" type="password" name="password" placeholder="Password" required>
            <button class="toggle-visibility" type="button" aria-label="Show password" data-target="login-password" aria-pressed="false">
              <!-- Eye (default) -->
              <svg class="icon eye" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <!-- Eye-off (hidden initially) -->
              <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 3-3c0-.5-.1-1-.3-1.4M9.9 4.3A12.7 12.7 0 0 1 12 4c7 0 11 8 11 8a15.7 15.7 0 0 1-3.3 4.2M6.3 6.3C2.7 8.6 1 12 1 12s4 8 11 8c2 0 3.8-.5 5.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn primary">Login</button>
          
          <!-- Social Login -->
          <div class="social-login">
            <p>or continue with</p>
            <div class="social-buttons">
              <a href="/auth/google/login" class="social-btn google">
                <img src="{{ url_for('static', path='/img/google-logo.png') }}" alt="Google">
              </a>
              <a href="/auth/github/login" class="social-btn github">
                <img src="{{ url_for('static', path='/img/github-icon.png') }}" alt="GitHub">
              </a>
            </div>
          </div>

          <!-- Switch to Signup -->
          <p class="switch-text">
            First time here?
            <a id="to-signup" class="switch-link">Start your journey with us</a>
          </p>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" method="post" action="/auth/signup" enctype="application/x-www-form-urlencoded" class="auth-form">
          <input type="text" name="name" placeholder="Name" required>
          <input type="email" name="email" placeholder="Email" required>

          <!-- Password Field with Toggle -->
          <div class="password-field">
            <input id="signup-password" type="password" name="password" placeholder="Password" required>
            <button class="toggle-visibility" type="button" aria-label="Show password" data-target="signup-password" aria-pressed="false">
              <svg class="icon eye" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9.9 4.3A12.7 12.7 0 0 1 12 4c7 0 11 8 11 8a15.7 15.7 0 0 1-3.3 4.2M6.3 6.3C2.7 8.6 1 12 1 12s4 8 11 8c2 0 3.8-.5 5.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="password-field">
            <input id="signup-confirm" type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button class="toggle-visibility" type="button" aria-label="Show password" data-target="signup-confirm" aria-pressed="false">
              <svg class="icon eye" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9.9 4.3A12.7 12.7 0 0 1 12 4c7 0 11 8 11 8a15.7 15.7 0 0 1-3.3 4.2M6.3 6.3C2.7 8.6 1 12 1 12s4 8 11 8c2 0 3.8-.5 5.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <small id="password-match-message" class="password-feedback"></small>

          <button type="submit" class="btn primary">Sign Up</button>

          <!-- Switch to Login -->
          <p class="switch-text">
            Already on your journey?
            <a id="to-login" class="switch-link">Login here</a>
          </p>
        </form>

        <!-- Back to Home -->
        <a href="/" class="back-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="#2e6a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Home
        </a>

      </div>
    </section>

    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
  </body>
</html>
