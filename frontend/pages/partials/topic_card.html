<div class="topic-card" id="card-{{ card.id }}" data-card-id="{{ card.id }}">

  <div class="topic-top">
    <h4>{{ card.title }}</h4>
    <div class="topic-meta">{{ card.subtitle }}</div>
  </div>

  {# DONE STATE (compact) #}
  {% if card.subtitle and "Marked as done" in card.subtitle %}
    <div class="topic-done-row">
      <span class="done-pill">Done</span>
      <button
        class="btn ghost"
        hx-delete="/cv/card"
        hx-vals='{"card_id":"{{ card.id }}"}'
        hx-target="#card-{{ card.id }}"
        hx-swap="outerHTML">
        Dismiss
      </button>
    </div>

  {% else %}

    <ul class="topic-tips">
      {% for tip in card.tips %}
        <li>{{ tip }}</li>
      {% endfor %}
    </ul>

    <details class="topic-example">
      <summary>Show example</summary>
      <div class="example-box">
        {{ card.example | safe }}
      </div>

      <div class="topic-actions">
        <button
          class="btn ghost"
          hx-post="/cv/card/variant"
          hx-vals='{"card_id":"{{ card.id }}"}'
          hx-target="#card-{{ card.id }}"
          hx-swap="outerHTML"
          hx-indicator="#ai-loading">
          Another example
        </button>

        <button
          class="btn primary"
          hx-post="/cv/card/accept"
          hx-vals='{"card_id":"{{ card.id }}"}'
          hx-target="#card-{{ card.id }}"
          hx-swap="outerHTML">
          Mark done
        </button>

        <button
          class="btn ghost"
          hx-delete="/cv/card"
          hx-vals='{"card_id":"{{ card.id }}"}'
          hx-target="#card-{{ card.id }}"
          hx-swap="outerHTML">
          Dismiss
        </button>
      </div>
    </details>

  {% endif %}
</div>
